#
# The application: a headless runner that loads the embedded .pte and runs one
# inference on the Ethos-U85. ExecuTorch runtime + operator components come from
# the AI layer; board bring-up from the Board layer.
project:
  packs:
    - pack: PyTorch::ExecuTorch
      path: ./packs/PyTorch.ExecuTorch.1.4.0-rc2
    - pack: ARM::CMSIS

  misc:
    - CPP:
        - -std=gnu++17
        - -Wno-deprecated-declarations
    - for-compiler: GCC
      C:
        - -Wno-psabi
      CPP:
        - -Wno-psabi
      Link:
        - -Wl,-u,_printf_float

  add-path:
    # Where the model-conversion build step drops the generated model header.
    - $SolutionDir()$/ai_layer/model

  groups:
    - group: App
      files:
        - file: ./src/app_main.cpp
        # Generated by the convert-model build step below. Listing it as a
        # project source makes CMSIS-Toolbox schedule that step BEFORE
        # compilation (a generated build input runs pre-build).
        - file: ./ai_layer/model/model_pte.h

  layers:
    - layer: $Board-Layer$
      type: Board
    - layer: $AI-Layer$
      type: AI

  # Model conversion as a build step. Runs the venv's PyTorch export, driven by
  # the MLOps metadata (cbuild-mlops.yml), and regenerates model_pte.h plus the
  # AI layer's component selection whenever the model or NPU config changes.
  # If the operator set (and thus the clayer) changed, the step fails with a
  # re-run hint, since components are resolved before the build starts.
  executes:
    - execute: convert-model
      run: bash $input(0)$
      input:
        - $SolutionDir()$/scripts/run_export.sh
        - $SolutionDir()$/model/model.py
        - $SolutionDir()$/model/export_model.py
        - $SolutionDir()$/cmsis-executorch-simple.cbuild-mlops.yml
        - $SolutionDir()$/scripts/gen_components.py
      output:
        # NOTE: ai_layer.clayer.yml is deliberately NOT listed here. It is a
        # configure-time input; the step only rewrites it (and then aborts the
        # build) when the operator set changed, so declaring it as an output
        # would make ninja consider this step perpetually out of date.
        - $SolutionDir()$/ai_layer/model/model_pte.h

  output:
    type:
      - elf
