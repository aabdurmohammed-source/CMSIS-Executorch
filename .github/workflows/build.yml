#
# CI for the three-step flow (cbuild setup, create_ai_layer.py, cbuild)
# followed by an FVP run.
name: Build and Run

on:
  workflow_dispatch:
  push:
    branches: [hackathon]
  pull_request:
    branches: [hackathon]

env:
  SOLUTION: cmsis-executorch
  TARGET: SSE-320-U85

jobs:
  # Full build plus an FVP run. Linux only: the FVP needs an Arm user-based
  # license, so matrixing this across hosts is not cheap.
  build-and-run:
    name: Build and run on Corstone-320
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install tools
        uses: ARM-software/cmsis-actions/vcpkg@v1

      - name: Activate Arm tool license
        uses: ARM-software/cmsis-actions/armlm@v1

      # The FVP loads the runner's libpython3.11, whose standard library is
      # not where that build's prefix says; the model then dies at start-up
      # with "Fatal Python error: init_fs_encoding". PYTHONHOME (set on the
      # FVP step only) points it at a complete Python 3.11.
      - name: Set up Python 3.11 for the FVP
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache packs
        uses: actions/cache@v6
        with:
          key: cmsis-packs
          path: /home/runner/.cache/arm/packs

      # torch + executorch is a multi-gigabyte install and otherwise dominates
      # the job. Keyed on the requirements files so a pin change rebuilds it.
      - name: Cache model-export venv
        uses: actions/cache@v6
        with:
          key: venv-${{ runner.os }}-${{ hashFiles('requirements*.txt', 'setup_venv.py') }}
          path: .venv

      - name: Create model-export venv
        run: ./setup_venv.sh

      - name: Generate the MLOps information
        run: cbuild setup ${SOLUTION}.csolution.yml --active ${TARGET} --packs --update-rte

      - name: Create the AI layer
        run: python3 create_ai_layer.py ${SOLUTION}.cbuild-mlops.yml

      - name: Build
        run: cbuild ${SOLUTION}.csolution.yml --active ${TARGET}

      - name: Run on the FVP
        env:
          PYTHONHOME: ${{ env.pythonLocation }}
        run: |
          IMAGE=$(find out -name "${SOLUTION}.axf" -o -name "${SOLUTION}.elf" | head -1)
          echo "Running ${IMAGE}"
          # stdio is retargeted to semihosting, so the output arrives on the
          # FVP's own stdout.
          FVP_Corstone_SSE-320 \
              -f board/Corstone-320/fvp_config.txt \
              -a "${IMAGE}" \
              --simlimit 60 --stat \
              | tee fvp_stdout.log

          echo "Checking simulation output"
          grep -q "Test_result: PASS" fvp_stdout.log

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corstone-320-build
          path: |
            fvp_stdout.log
            out/**/*.axf
            out/**/*.elf
            ai_layer/

  # The same solution for the Alif Ensemble E8 DevKit (target-type DevKit-E8).
  # Build only: the hardware is not in CI. The shipped ai_layer/ is used, so no
  # venv is needed.
  build-devkit-e8:
    name: Build for the Alif Ensemble E8 DevKit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install tools
        uses: ARM-software/cmsis-actions/vcpkg@v1

      - name: Activate Arm tool license
        uses: ARM-software/cmsis-actions/armlm@v1

      - name: Cache packs
        uses: actions/cache@v6
        with:
          key: cmsis-packs
          path: /home/runner/.cache/arm/packs

      - name: Generate the MLOps information
        run: cbuild setup ${SOLUTION}.csolution.yml --active DevKit-E8 --packs --update-rte

      - name: Build
        run: cbuild ${SOLUTION}.csolution.yml --active DevKit-E8

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devkit-e8-build
          path: |
            out/**/*.axf
            out/**/*.hex

  # The export flow must work on all three host OSes -- that is the point of a
  # venv-based (rather than Docker-based) model build. No FVP and no Arm
  # license needed, so this is cheap to matrix. Without this job, Windows
  # support regresses on the first refactor and nobody notices.
  venv-cross-platform:
    name: Model export venv (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create model-export venv (POSIX)
        if: runner.os != 'Windows'
        run: ./setup_venv.sh

      - name: Create model-export venv (Windows)
        if: runner.os == 'Windows'
        run: .\setup_venv.bat

      - name: Check the export entry point
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
              PY=.venv/Scripts/python.exe
          else
              PY=.venv/bin/python
          fi
          "${PY}" -c "import executorch.backends.arm.quantizer.quantization_annotator; print('arm quantizer OK')"
          # No cbuild-mlops.yml without cbuild; importing the script checks
          # that it parses under this interpreter.
          "${PY}" -c "import create_ai_layer; print('create_ai_layer.py OK')"

      - name: Report resolved versions
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
              PY=.venv/Scripts/python.exe
          else
              PY=.venv/bin/python
          fi
          "${PY}" -m pip list | grep -iE "torch|executorch|vela|tosa|flatbuffers"
          # flatbuffers must stay at 24.3.25: tosa-tools wants 25.2.10 and is
          # installed --no-deps precisely to stop that. See
          # requirements-arm-tosa.txt.
          # No grep -q: with pipefail, grep closing the pipe early fails the step.
          "${PY}" -m pip show flatbuffers | grep "Version: 24.3.25" \
              || { echo "::error::flatbuffers pin regressed"; exit 1; }
